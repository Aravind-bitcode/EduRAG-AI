<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Futuristic Letter E Base -->
  <g filter="url(#glow)">
    <!-- Vertical Spine of E -->
    <path d="M 140 120 L 210 120 L 210 390 L 140 390 Z" fill="url(#accentGrad)" />
    
    <!-- Top Bar of E with Graduation Cap Angle -->
    <path d="M 210 120 L 370 120 Q 390 120 390 140 L 390 160 Q 390 180 370 180 L 210 180 Z" fill="url(#accentGrad)" />
    
    <!-- Middle Bar of E (Shorter with Neural Node Sparkle) -->
    <path d="M 210 230 L 330 230 Q 350 230 350 250 L 350 260 Q 350 280 330 280 L 210 280 Z" fill="url(#cyanGrad)" />
    
    <!-- Bottom Bar of E -->
    <path d="M 210 330 L 370 330 Q 390 330 390 350 L 390 370 Q 390 390 370 390 L 210 390 Z" fill="url(#accentGrad)" />

    <!-- AI Knowledge Sparkle Star -->
    <path d="M 370 200 L 380 230 L 410 240 L 380 250 L 370 280 L 360 250 L 330 240 L 360 230 Z" fill="#38BDF8"/>

    <!-- Graduation Cap Accent overlay on top -->
    <polygon points="256,65 375,115 256,165 137,115" fill="url(#cyanGrad)" opacity="0.9"/>
    <polygon points="200,142 200,185 256,205 312,185 312,142" fill="url(#accentGrad)" opacity="0.7"/>
    <circle cx="375" cy="115" r="8" fill="#F59E0B"/>
    <path d="M 375 115 L 390 165" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
